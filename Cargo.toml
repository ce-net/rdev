[package]
name = "rdev"
version = "0.2.1"
edition = "2024"
description = "Remote-dev app on CE — exec + file sync/mirror over the mesh, gated by capabilities. An application built ON CE primitives, not part of the node."
license = "AGPL-3.0-only"
repository = "https://github.com/ce-net/rdev"

# rdev is both a reusable substrate library (the chunk/CID delta-sync engine that ce-pin and Notes
# depend on) and the `rdev` binary (the first consumer). The library is the Auto-Sync v2 substrate.
[lib]
name = "rdev"
path = "src/lib.rs"

[[bin]]
name = "rdev"
path = "src/main.rs"

[dependencies]
ce-rs = { git = "https://github.com/ce-net/ce-rs" }         # mesh transport (AppRequest/reply) + status
ce-wallet = { git = "https://github.com/ce-net/ce" }             # the ONE wallet/roots schema
ce-cap = { git = "https://github.com/ce-net/ce" }            # the capability verifier primitive
ce-container = { git = "https://github.com/ce-net/ce" }      # the run-a-container primitive (bollard/gVisor)
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bincode = "1"
dirs-next = "2"
walkdir = "2"
notify = "6"
toml = "0.8"
bollard = "0.17"
diffy = "0.4"   # 3-way text merge for the CRDT conflict policy (pure Rust, cross-compiles)

# Unix-only: setsid (detach run-jobs into their own session/process group) + kill (group signal,
# liveness probe). rdev/run/* uses these to detach long-lived host jobs and to kill the whole group.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
ce-identity = { git = "https://github.com/ce-net/ce" }
# In-process node for the two-node Auto-Sync v2 integration test (NEXT_PORT pattern, mirroring
# ce-node's local_cluster). The test spins two real nodes, wires them over the mesh, and drives the
# delta engine + blob store + ce-cap authorization end-to-end. It skips gracefully if a node cannot
# start (e.g. a locked-down CI sandbox), so it never regresses the pure-unit suite.
ce-node = { git = "https://github.com/ce-net/ce" }
