[package]
name = "rdev"
version = "0.1.0"
edition = "2024"
description = "Remote-dev app on CE — device-to-device file sync over the mesh, gated by capabilities. An application built ON CE primitives, not part of the node."
license = "MIT"
repository = "https://github.com/ce-net/rdev"

[dependencies]
ce-rs = { git = "https://github.com/ce-net/ce-rs" }         # mesh transport (AppRequest/reply) + status
ce-cap = { git = "https://github.com/ce-net/ce" }            # the capability verifier primitive
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
dirs-next = "2"
