# rdev — remote exec + content-addressed file sync over the CE mesh, installed and
# supervised through the one `ce` binary. Install on every device with:
#   ce app install rdev --on fleet=mine
# Each device then runs `rdev serve` (the daemon) to accept capability-authed sync/exec.

[app]
name    = "rdev"
version = "0.2.0"
summary = "Remote exec + content-addressed file sync over the CE mesh"
runtime = "native"
publisher = "c0be11e0ce0aaa769da6f9970244947d3d32a0c0d8302fb5f41f73d7950be456"

[native]
bin = "rdev"
[native.artifacts]
# sha256 of each release binary, uploaded to ce-hub /blobs.
"darwin-amd64" = "949b932cea0b7d3c29e6dcdbee2f9fb4c58ec529cca5b3358afe86d8c347ee2a"
"linux-amd64"  = "7d82d653970335bfee7b740d479ff627fa0740290f99e43e9d394e952dfa1909"

[deps]
# rdev's abilities: it runs sandboxed exec, host spawn, file sync/delete, and tunnels —
# all capability-authed per request by the ce-cap verifier on the receiving node.
capabilities = ["exec", "spawn", "sync", "delete", "tunnel"]
system = { docker = "optional" }   # `rdev exec` uses gVisor/Docker when present; degrades without

[sandbox]
# rdev syncs HOST files and spawns HOST processes — it cannot run in a gVisor/runc jail
# (that is the whole point of the tool). It talks to the LOCAL node over loopback for the
# mesh transport (ce-rs AppRequest), and authorizes every inbound request via ce-cap.
tier       = "none"        # explicit + audited; the host-access case
net        = "loopback"    # mesh transport via the local node (127.0.0.1:8844)
capability = "inherit"     # reuses the node wallet/caps for outbound; inbound is ce-cap-gated

[daemon]
# `rdev serve` accepts inbound rdev requests AND, on dev-fleet machines (those with the ~/ce-net
# workspace + peer links), runs live git-sync in the same process — so one ce-appmgr-supervised daemon
# gives sync + exec + git-sync with no separate launchd/systemd unit (the old com.ce-net.gitsync plist is
# retired). Enabled so a fleet-installed device is reachable and syncing without a manual start.
enabled = true
args    = ["serve"]
restart = "on-failure"
